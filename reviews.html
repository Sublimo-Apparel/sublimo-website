      <p class="label" data-i18n="rv.label">From our Messenger inbox</p>

      <a href="#quotes" data-i18n="sub.quotes">Reviews</a>
      <a href="#photos" data-i18n="sub.photos">Team photos</a>

  <!-- QUOTES -->
  <section class="section bg-ink-2" id="quotes">
    <div class="wrap grid gap-8 md:grid-cols-2 md:gap-10">
      <figure data-rv-item class="grid content-start gap-4 border-t border-line pt-6.5 md:col-span-2"><blockquote data-rv="r2" class="font-display text-[clamp(2.2rem,4.6vw,4rem)] font-semibold leading-none"></blockquote><figcaption><cite class="font-display text-[.8rem] font-bold not-italic uppercase tracking-[.2em] text-mint" data-i18n="rv.c2">Jersey order</cite></figcaption></figure>
      <figure data-rv-item class="grid content-start gap-4 border-t border-line pt-6.5"><blockquote data-rv="r1" class="font-display text-[clamp(1.6rem,2.6vw,2.2rem)] font-semibold leading-[1.12]"></blockquote><figcaption><cite class="font-display text-[.8rem] font-bold not-italic uppercase tracking-[.2em] text-mint" data-i18n="rv.c1">Office polo order</cite></figcaption></figure>
      <figure data-rv-item class="grid content-start gap-4 border-t border-line pt-6.5"><blockquote data-rv="r3" class="font-display text-[clamp(1.6rem,2.6vw,2.2rem)] font-semibold leading-[1.12]"></blockquote><figcaption><cite class="font-display text-[.8rem] font-bold not-italic uppercase tracking-[.2em] text-mint" data-i18n="rv.c3">National Teachers' Day polo</cite></figcaption></figure>

      <figure data-rv-item class="grid content-start gap-4 border-t border-line pt-6.5"><blockquote data-rv="r5" class="font-display text-[clamp(1.6rem,2.6vw,2.2rem)] font-semibold leading-[1.12]"></blockquote><figcaption><cite class="font-display text-[.8rem] font-bold not-italic uppercase tracking-[.2em] text-mint" data-i18n="rv.c5">Repeat customer</cite></figcaption></figure>
    </div>
  </section>

  <!-- TEAM PHOTOS -->
  <section class="section" id="photos">
    <div class="wrap">
      <div class="mb-10 grid gap-5 md:mb-14">
        <p class="label" data-i18n="ph.label">Teams wearing Sublimo</p>
        <h2 class="title-lg"><span data-i18n="ph.t1">Worn by</span> <span class="text-mint" data-i18n="ph.t2">them.</span></h2>
      </div>
      <div class="grid auto-rows-[clamp(140px,14vw,190px)] grid-cols-2 gap-2 md:grid-cols-6">
        <figure data-rv-item class="col-span-2 row-span-2 overflow-hidden"><img src="img/cl-college.jpg" alt="Large college group in matching light blue shirts" loading="lazy" decoding="async" class="size-full object-cover grayscale-40 transition duration-500 hover:grayscale-0"></figure>
        <figure data-rv-item class="row-span-2 overflow-hidden"><img src="img/cl-sanmarcos.jpg" alt="Two players in San Marcos jerseys" loading="lazy" decoding="async" class="size-full object-cover grayscale-40 transition duration-500 hover:grayscale-0"></figure>
        <figure data-rv-item class="col-span-2 overflow-hidden max-md:col-span-1 max-md:row-span-2"><img src="img/cl-team-blue.jpg" alt="Team in matching blue and white jerseys" loading="lazy" decoding="async" class="size-full object-cover grayscale-40 transition duration-500 hover:grayscale-0"></figure>
        <figure data-rv-item class="overflow-hidden max-md:col-span-2"><img src="img/cl-kid.jpg" alt="Young boy in a Titans United jersey set" loading="lazy" decoding="async" class="size-full object-cover object-top grayscale-40 transition duration-500 hover:grayscale-0"></figure>

        <figure data-rv-item class="overflow-hidden max-md:col-span-2"><img src="img/cl-girls.jpg" alt="Students in black and white jerseys" loading="lazy" decoding="async" class="size-full object-cover grayscale-40 transition duration-500 hover:grayscale-0"></figure>
      </div>
    </div>
