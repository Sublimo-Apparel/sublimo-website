# Pages CMS settings (https://pagescms.org)
# Sign in at https://app.pagescms.org with your GitHub account and open this repository.

media:
  input: img/designs
  output: img/designs
  categories: [image]

content:
  - name: designs
    label: Layout studio designs
    type: file
    path: data/designs.json
    format: json
    list: true
    fields:
      - name: image
        label: Design image (square works best)
        type: image
        required: true
      - name: name
        label: Team or client name
        type: string
        required: true
      - name: type
        label: Type
        type: select
        required: true
        options:
          values: [Jersey, Polo, Chinese collar, Shirt, Long sleeves, Shorts, Singlet, Warmer]
      - name: set
        label: Matching set (optional, same name on every piece of the set, e.g. "Vanguard")
        type: string
      - name: added
        label: Date added (shows a NEW badge for 30 days)
        type: date
      - name: description
        label: Short description (English)
        type: string
      - name: description_tl
        label: Short description (Tagalog, optional)
        type: string

  - name: team
    label: Team members (About page)
    type: file
    path: data/team.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: photo
        label: Photo (optional, square works best; initials show if empty)
        type: image
